# 🔐 Scan de secrets (Gitea Actions)
#
# Copié automatiquement dans .gitea/workflows/secrets-scan.yml par `mkrpo`.
#
# Scanne l'historique du dépôt avec gitleaks et fait échouer le job si un secret est
# détecté (clé API, token, mot de passe...). Contrairement à audit.yml (veille de
# vulnérabilités, volontairement non bloquant), un secret détecté dans ce dépôt précis
# n'a pas d'excuse à être ignoré.
#
# 📖 Référence : repos-meta/SECRET_SCANNING.md

name: 🔐 Scan de secrets

on:
  push:
  workflow_dispatch:

env:
  # Épinglée pour la reproductibilité — vérifier les releases avant de faire monter ce
  # numéro : https://github.com/gitleaks/gitleaks/releases
  GITLEAKS_VERSION: "8.30.1"

jobs:
  secrets-scan:
    name: 🔐 gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          # Historique complet : gitleaks doit voir tous les commits, pas seulement le
          # dernier (checkout par défaut en profondeur 1).
          fetch-depth: 0

      - name: 📦 Installer gitleaks
        # Téléchargement direct du binaire depuis GitHub Releases — pas de `cache: pip`
        # ni d'action tierce passant par le backend de cache Actions, injoignable
        # depuis le runner self-hosted (voir repos-meta/CI_CD_ISSUES_AND_SOLUTIONS.md).
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: 🔐 Scan de secrets
        # Bloquant : pas de continue-on-error. Un secret détecté fait échouer le job.
        # `.gitleaks.toml` (s'il existe à la racine du dépôt) porte l'allowlist des
        # faux positifs connus — voir repos-meta/SECRET_SCANNING.md.
        run: gitleaks detect --source . --verbose --redact
