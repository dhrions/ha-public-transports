name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Ne PAS ajouter `cache: pip` : backend de cache injoignable depuis le runner
          # self-hosted -> plusieurs minutes de timeouts.

      - name: Install dependencies
        run: |
          # venv dédié, pas le Python global du hostedtoolcache : sur le runner
          # self-hosted, ce Python est partagé entre tous les dépôts du parc. Un job
          # d'un autre dépôt (ex. siri-lite, `pip install -e ".[dev]"`) peut y enregistrer
          # un paquet en editable pointant vers son propre workspace éphémère — une fois
          # ce job terminé et son workspace nettoyé, l'import casse silencieusement pour
          # tout job suivant qui réutilise ce même Python (symptôme observé : "Requirement
          # already satisfied" au pip install, puis ModuleNotFoundError à l'import).
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.test.txt

      - name: Tests
        run: .venv/bin/pytest tests/ -q
