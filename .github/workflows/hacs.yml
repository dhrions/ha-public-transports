# Validation HACS store (hacs.json, manifest.json...) via l'action officielle
# hacs/action, spécifique à GitHub — pas d'équivalent côté Gitea Actions, donc pas un
# doublon d'une CI attendue en .gitea/workflows/ : ce fichier sert de repli légitime
# (cf. CLAUDE.md § CI/CD).
name: HACS Action

on:
  push:
  pull_request:

jobs:
  hacs:
    name: HACS Action
    if: github.repository_owner == 'dhrions'
    runs-on: "ubuntu-latest"
    steps:
      - name: 📥 Checkout the repository
        uses: actions/checkout@v4

      - name: HACS Action
        uses: "hacs/action@main"
        with:
          category: "integration"
